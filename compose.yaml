services:
  app:
    build:
      context: .
      target: app
    environment:
      APP_NAME: ${APP_NAME:-Inventory API}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-inventory}
      DB_USERNAME: ${DB_USERNAME:-inventory}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      CACHE_LIMITER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: sync
      INVENTORY_API_RATE_LIMIT: ${INVENTORY_API_RATE_LIMIT:-60}
      INVENTORY_LOGIN_RATE_LIMIT: ${INVENTORY_LOGIN_RATE_LIMIT:-5}
      INVENTORY_LOGIN_IP_RATE_LIMIT: ${INVENTORY_LOGIN_IP_RATE_LIMIT:-20}
      INVENTORY_TOKEN_EXPIRATION: ${INVENTORY_TOKEN_EXPIRATION:-1440}
      INVENTORY_SEED_USER_EMAIL: ${INVENTORY_SEED_USER_EMAIL:-}
      INVENTORY_SEED_USER_PASSWORD: ${INVENTORY_SEED_USER_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inventory}
      MYSQL_USER: ${DB_USERNAME:-inventory}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
